<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>正在游玩 · 游戏组件</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
    display: flex; padding: 20px; }
  body { justify-content: flex-start; align-items: flex-end; }
  body.pos-tr { justify-content: flex-end; align-items: flex-start; }
  body.pos-br { justify-content: flex-end; align-items: flex-end; }
  body.pos-tl { justify-content: flex-start; align-items: flex-start; }

  /* 卡片：左标签 + 中间游戏名 + 右时间，一条横向条，带淡入淡出 */
  .card { display: inline-flex; align-items: stretch; gap: 0; height: var(--h);
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
    opacity: 0; transform: translateY(12px); pointer-events: none;
    transition: opacity .45s ease, transform .45s ease; }
  .card.show { opacity: 1; transform: none; pointer-events: auto; }

  /* 左侧：当前游戏 标签 */
  .tag { display: flex; align-items: center; padding: 0 22px; font-size: calc(var(--fs) + 1px);
    font-weight: 800; letter-spacing: .04em; color: #1a1a1a;
    background: linear-gradient(180deg, #f0f0f0, #d9d9d9); white-space: nowrap; }

  /* 中间：游戏名 */
  .mid { display: flex; align-items: center; gap: 12px; padding: 0 24px; min-width: 0;
    background: linear-gradient(180deg, #161616, #050505); }
  .thumb { width: calc(var(--fs) * 2.4); height: calc(var(--fs) * 1.5); flex: none;
    border-radius: 5px; overflow: hidden; background: #000 center/cover no-repeat;
    display: none; }
  .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .thumb.hidden { display: none; }
  .mid.thumb-show .thumb { display: block; }
  #name { font-size: var(--fs); font-weight: 800; color: #fff; line-height: 1.2;
    max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 右侧：TIME 时长 */
  .time { display: flex; align-items: center; gap: 10px; padding: 0 24px;
    background: linear-gradient(180deg, #101a2b, #07101c); }
  .time .k { font-size: calc(var(--fs) - 4px); font-weight: 800; letter-spacing: .18em;
    color: #4aa3ff; text-transform: uppercase; }
  .time .v { font-size: calc(var(--fs) + 1px); font-weight: 800; color: #fff;
    font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* 浅色主题 */
  body.light .tag { color: #111; background: linear-gradient(180deg,#fff,#e6e6e6); }
  body.light .mid { background: linear-gradient(180deg,#2a2a2a,#111); }
  body.light .time { background: linear-gradient(180deg,#eaf2ff,#dbe7fb); }
  body.light .time .k { color: #1e6fd9; }
  body.light #name { color: #fff; }
  body.light .time .v { color: #111; }

  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="tag" id="tag">当前游戏</div>
    <div class="mid" id="mid">
      <div class="thumb hidden" id="thumb"><img id="cover" alt=""></div>
      <span id="name">—</span>
    </div>
    <div class="time" id="timeCol"><span class="k">TIME</span><span class="v" id="session">00:00</span></div>
  </div>

<script>
  const qs = new URLSearchParams(location.search);
  const DEMO = qs.get("demo") === "1";
  const posOverride = qs.get("pos");
  const demoStart = Date.now();
  const card = document.getElementById("card");
  const DEFAULTS = { pos:"bl", theme:"dark", accent:"#66c0f4", fontSize:20, height:64,
    showCover:false, showPlatform:true, showTime:true };
  let cfg = DEFAULTS;

  function applyCfg(c) {
    cfg = Object.assign({}, DEFAULTS, c || {});
    const pos = posOverride || cfg.pos || "bl";
    document.body.className = (cfg.theme === "light" ? "light " : "") + "pos-" + pos;
    document.documentElement.style.setProperty("--accent", cfg.accent || "#66c0f4");
    document.documentElement.style.setProperty("--fs", (cfg.fontSize || 20) + "px");
    document.documentElement.style.setProperty("--h", (cfg.height || 64) + "px");
    document.getElementById("thumb").classList.toggle("hidden", !cfg.showCover);
    document.getElementById("timeCol").classList.toggle("hidden", !cfg.showTime);
    document.getElementById("tag").classList.toggle("hidden", !cfg.showPlatform);
  }

  function fmt(s) {
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
    const p = n => String(n).padStart(2, "0");
    return h > 0 ? `${p(h)}:${p(m)}:${p(sec)}` : `${p(m)}:${p(sec)}`;
  }

  function render(d) {
    if (!d.running) { card.classList.remove("show"); return; }
    document.getElementById("name").textContent = d.name || "游戏中";
    document.getElementById("session").textContent = fmt(d.sessionSeconds || 0);
    const cover = document.getElementById("cover");
    if (d.cover) { cover.src = d.cover; cover.style.display = "block";
      cover.onerror = () => { cover.style.display = "none"; cover.src=""; }; }
    else { cover.style.display = "none"; cover.src=""; }
    document.getElementById("mid").classList.toggle("thumb-show", !!cfg.showCover && !!cover.src);
    card.classList.add("show");
  }

  async function getJSON(path) { return (await fetch(path, { cache: "no-store" })).json(); }
  function applyDemo() {
    applyCfg(DEFAULTS);
    render({ running:true, name:"共鸣：瘟疫传说传承", appid:1086940, platformLabel:"Steam",
      cover:"https://cdn.cloudflare.steamstatic.com/steam/apps/1086940/header.jpg",
      sessionSeconds: Math.floor((Date.now()-demoStart)/1000) });
  }

  async function tick() {
    if (DEMO) { applyDemo(); return; }
    try {
      const [cfgData, st] = await Promise.all([getJSON("/api/game/settings"), getJSON("/api/query/game")]);
      applyCfg(cfgData); render(st);
    } catch (e) { card.classList.remove("show"); }
  }
  tick();
  setInterval(tick, 1500);
</script>
</body>
</html>
